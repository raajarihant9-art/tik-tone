<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TIK TONE</title>
<style>
body{
  margin:0;
  font-family:Arial;
  background:#f2faff;
  color:#17324d;
}
header{
  background:#0877d1;
  color:white;
  text-align:center;
  padding:25px;
}
h1{margin:0;}
.box{
  background:white;
  margin:15px;
  padding:20px;
  border-radius:15px;
}
button{
  background:#0877d1;
  color:white;
  border:0;
  padding:12px 18px;
  border-radius:10px;
}
</style>
</head>

<body>
  

<header>
<h1>🥛 tik tone</h1>
<p>Fresh Milk • Fast Delivery</p>
</header>

<div class="box">
<h2>Taaza Doodh, Ghar Tak 🥛</h2>
<p>Fresh milk aur dairy products order karein.</p>
<button>Order Now</button>
</div><section class="order-box">
  <h2>🥛 Doodh Kharidne Ke Liye Contact Karein</h2>

  <input type="text" id="customerName" placeholder="Apna Naam" required>

  <textarea id="customerAddress" placeholder="Apna Pata"></textarea>

  <input type="tel" id="customerPhone" placeholder="Mobile Number" required>

  <button onclick="sendWhatsApp()">
    📲 WhatsApp Par Order Bheje
  </button>
</section>

<script>
function sendWhatsApp() {
  const name = document.getElementById("customerName").value;
  const address = document.getElementById("customerAddress").value;
  const phone = document.getElementById("customerPhone").value;

  if (!name || !address || !phone) {
    alert("Bhai, Naam, Pata aur Mobile Number bhariye!");
    return;
  }

  const message =
    "🥛 Naya Doodh Order%0A%0A" +
    "👤 Naam: " + encodeURIComponent(name) + "%0A" +
    "📍 Pata: " + encodeURIComponent(address) + "%0A" +
    "📱 Mobile: " + encodeURIComponent(phone);

  // Yahan APNA WhatsApp number daalo
  const myWhatsApp = "91XXXXXXXXXX";
const myWhatsApp = "9718790985";
  window.open(
    "https://wa.me/" + myWhatsApp + "?text=" + message,
    "_blank"
  );
}
</script>
  <div class="moving-name">
  🥛 Tik tone 🥛
</div>
  <style>
.moving-name {
  font-size: 28px;
  font-weight: bold;
  white-space: nowrap;
  position: relative;
  animation: moveName 5s linear infinite alternate;
}

@keyframes moveName {
  from {
    left: 0;
  }
  to {
    left: 70%;
  }
}
</style>
